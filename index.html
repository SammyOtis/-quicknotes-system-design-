<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNotes Online Service</title>
  <link rel="stylesheet" href="style.css">
  <script src="api.js" defer></script>
</head>
<body>

  <header>
    <h1>QuickNotes API Client</h1>
    <p>Connected to remote REST API</p>
  </header>

  <main>
    <section>
      <h2>Add a New Note</h2>
      <form id="note-form">
        <p>
          <label for="title-input">Title:</label>
          <input type="text" id="title-input" placeholder="Note title (max 100 chars)..." autocomplete="off">
        </p>
        <p>
          <label for="body-input">Body:</label>
          <textarea id="body-input" rows="4" placeholder="Type your note body here..."></textarea>
        </p>
        <button id="submit-btn" type="submit">Create Note</button>
      </form>
    </section>

    <section>
      <h2>Notes Directory</h2>
      <button id="load-btn" type="button">Load notes</button>
      <p id="status" class="status-message"></p>
      <ul id="notes-list"></ul>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 QuickNotes. All rights reserved.</p>
  </footer>

</body>
</html>
